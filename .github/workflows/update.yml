name: Update data

on:
  schedule:
    # Times are UTC (Central is UTC-6 in winter, UTC-5 in summer).
    - cron: "17 11 * * *"     # daily ~5am CT: full refresh (scores, rosters, stats)
    - cron: "40 16 * * 0"     # Sunday ~10:40am CT: rosters again for final injury tags
    - cron: "*/15 * * * *"    # every 15 min: scores + stats, but only when a game is live or about to start
  workflow_dispatch: {}       # "Run workflow" button = full refresh

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        run: |
          case "${{ github.event.schedule }}" in
            "*/15 * * * *") python scripts/update.py --auto ;;   # cheap no-op outside game windows
            *)              python scripts/update.py ;;          # full refresh (also manual runs)
          esac
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
