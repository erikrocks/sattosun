<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>IA Hawks</title>
<meta name="description" content="Iowa football on Saturday, every former Hawkeye in the NFL on Sunday: live scores, stat lines, news and roster status.">
<meta property="og:title" content="IA Hawks">
<meta property="og:site_name" content="IA Hawks">
<meta property="og:type" content="website">
<meta property="og:url" content="https://iahawks.com/">
<meta property="og:image" content="https://iahawks.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://iahawks.com/">
<meta property="og:description" content="Iowa football on Saturday, every former Hawkeye in the NFL on Sunday: live scores, stat lines, news and roster status.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/iowa.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#FFCD00; --accent-ink:#000; --bg:#0A0A0A; --card:#151515; --line:#2A2A2A;
    --text:#F2F2F2; --muted:#9A9A9A; --dim:#6B6B6B; --live:#FF4D4D;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:3px solid var(--accent)}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 10px}
  .mark{flex:none;width:46px;height:30px}
  .eyebrow{font:700 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{margin:4px 0 0;font:800 28px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em}
  .week{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;
    font:800 15px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;padding:8px 12px;letter-spacing:.04em;white-space:nowrap}
  .weekwrap{position:relative;display:block}
  .weekwrap select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .weekwrap.pick .week::after{content:"";display:inline-block;margin-left:7px;vertical-align:2px;
    border:4px solid transparent;border-top:5px solid currentColor;border-bottom:0}
  .pastbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pastbar button{flex:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
  select.school{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 9px}
  .stat b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--accent)}
  .stat span{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.2}

  /* Controls */
  .search{position:relative;margin-bottom:10px}
  .search input{accent-color:var(--accent);width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px 14px 12px 40px;font-size:16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip .n{opacity:.7;margin-left:4px;font-weight:500}
  /* Phones: the row scrolls sideways, fading at whichever edge has more. Wider screens: it wraps so nothing hides. */
  .chips.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
  .chips.more-l{-webkit-mask-image:linear-gradient(270deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(270deg,#000 calc(100% - 44px),transparent)}
  .chips.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
  @media (min-width:560px){ .chips{flex-wrap:wrap;overflow:visible} }

  /* Game cards */
  .list{display:flex;flex-direction:column;gap:12px;padding:8px 0 20px}
  .game{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .game.live{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .gtop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;font-size:12px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .gtop .lv{color:var(--live);display:inline-flex;align-items:center;gap:6px}
  .gtop .lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .count{color:var(--accent)}
  .teams{padding:8px 14px 10px}
  .trow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname b{font:700 20px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin-right:6px}
  .tname span{color:var(--muted);font-size:14px}
  .score{font:800 24px/1 "Barlow Condensed",sans-serif;min-width:34px;text-align:right}
  .score.lose{color:var(--dim)}
  .players{border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
  .pteam{padding:9px 14px 2px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .p{display:flex;align-items:center;gap:10px;padding:7px 14px}
  .pos{flex:none;width:40px;text-align:center;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;
    border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:4px 0}
  .pname{font-weight:600;font-size:15px}
  .pname .num{color:var(--dim);font-weight:500;margin-left:4px;font-size:13px}
  .tag{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:#262626;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em}
  .tag.inj{background:rgba(255,77,77,.15);color:#FF8A8A}
  .p.out .pname,.p.out .pos{opacity:.45}
  .pmain{flex:1;min-width:0}
  .pmain .pname{display:block}
  .sl{display:block;font-size:13px;color:var(--accent);opacity:.9;margin-top:2px}
  .sl.quiet{color:var(--dim)}
  .roster-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .roster-h em{font-style:normal;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted)}
  .sync{display:inline-flex;align-items:center;gap:6px}
  .sync.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc84;animation:pulse 2s infinite}
  .p{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .p:active{background:rgba(255,255,255,.03)}
  .chev{flex:none;width:16px;height:16px;opacity:.45;transition:transform .15s}
  .p[aria-expanded="true"] .chev{transform:rotate(180deg);opacity:.8}
  .detail{padding:2px 14px 14px 64px}
  .detail .msg{font-size:13px;color:var(--muted);padding:4px 0}
  .bx{margin:8px 0 0}
  .bx h4{margin:0 0 4px;font:700 11px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .bx .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bx table{border-collapse:collapse;font-size:13px;min-width:100%}
  .bx th{font-weight:600;color:var(--muted);text-align:center;padding:4px 8px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11px}
  .bx td{text-align:center;padding:6px 8px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .links{display:flex;gap:14px;margin-top:10px;font-size:13px}
  .links a{color:var(--accent);text-decoration:none;font-weight:600}
  .warn{background:rgba(255,205,0,.08);border:1px solid rgba(255,205,0,.35);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;margin:4px 0 8px}
  mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 2px}

  .section-h{margin:18px 2px 8px;font:800 18px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .none{background:transparent;border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;color:var(--muted);font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  footer{color:var(--dim);font-size:12px;padding:6px 2px 40px;line-height:1.6}
  footer a{color:var(--muted)}
  .err{background:#2a1515;border:1px solid #5a2a2a;color:#ffb3b3;border-radius:var(--radius);padding:14px;margin-top:14px}
  @media (min-width:560px){ h1{font-size:34px} .stat b{font-size:34px} }

  .tagline{margin:12px 2px 0;font-size:13px;color:var(--muted)}
  .logo{flex:none;width:24px;height:24px;object-fit:contain}
  .logo.sm{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .key{font-size:12px;color:var(--dim);margin:2px 2px 8px}
  .key i{display:inline-block;width:22px;height:10px;border-radius:3px;border:1px solid var(--accent);opacity:.45;margin-right:6px;vertical-align:-1px}
  .head{float:right;width:96px;height:70px;object-fit:cover;object-position:top;margin:0 0 6px 10px;border-radius:8px;background:#1d1d1d}
  .linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
  .rank{flex:none;width:22px;text-align:center;font:800 18px/1 "Barlow Condensed",sans-serif;color:var(--dim)}
  .val{flex:none;font:800 22px/1 "Barlow Condensed",sans-serif;color:var(--accent);font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:12px 0 2px}
  .seg button{background:none;border:0;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .plays{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
  .plays li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .plays li:first-child{border-top:0}
  .plays .when{flex:none;width:58px;color:var(--dim);font-variant-numeric:tabular-nums}
  .plays .what{flex:1;color:var(--muted)}
  .plays .us .what{color:var(--text)}
  .plays .sc{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
  .watch{border-top:1px solid var(--line);padding:10px 14px 11px;font-size:14px;line-height:1.45}
  .watch h4{margin:0 0 3px;font:700 11px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .watch b{font-weight:700}
  .watch a{color:var(--accent);text-decoration:none;font-weight:600}
  .watch small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  /* Player sheet */
  .sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet-h{position:sticky;top:0;background:var(--bg);border-bottom:3px solid var(--accent);z-index:1}
  .sheet-h .wrap{display:flex;align-items:center;gap:12px;padding:10px 14px}
  .sheet-h h2{margin:0;font:800 26px/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
  .sheet-h p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .sheet-h img{width:64px;height:47px;object-fit:cover;object-position:top;border-radius:8px;background:#1d1d1d}
  .close{margin-left:auto;flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .sheet .wrap.body{padding-bottom:40px}
  .card-pad{padding:4px 14px 12px}
  .glog{padding:10px 14px;border-top:1px solid var(--line)}
  .glog:first-child{border-top:0}
  .glog b{font-weight:600;font-size:14px}
  .glog em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
  .loading{text-align:center;color:var(--muted);padding:40px 10px}
  .loading::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Bottom tabs */
  body.tabs{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .wrap{display:grid;grid-template-columns:1fr 1fr;padding:0}
  .tab{background:none;border:0;border-top:3px solid transparent;margin-top:-1px;padding:10px 0 9px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);-webkit-tap-highlight-color:transparent;
    font:800 19px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em}
  .tab small{font:600 10px/1 Inter,sans-serif;letter-spacing:.1em}
  .tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
  .tab .lv{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:6px;vertical-align:middle;animation:pulse 1.4s infinite}
  .tab .lv[hidden]{display:none}

  /* Saturday */
  .rk{font:700 12px/1 Inter,sans-serif;color:var(--muted);margin-right:5px;vertical-align:middle}
  .p.static{cursor:default}
  .p.static:active{background:none}
  .pos.cat{font-size:11px;border-color:var(--line);color:var(--muted)}
  .pos.date{width:48px;border:0;color:var(--muted);font-size:14px;line-height:1.15;padding:0}
  .psub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .tag.win{background:rgba(61,220,132,.14);color:#6fe3a5}
  .tag.loss{background:rgba(255,77,77,.15);color:#FF8A8A}
  .tag.res{font-size:13px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .detail.wide{padding-left:14px}
  .root .rsum{display:block;font-size:14px;line-height:1.45;color:var(--text)}
  .root .rsum + .rsum{margin-top:4px;color:var(--muted)}
  .rg{border-top:1px solid var(--line);padding:11px 14px 12px}
  .rhead{display:flex;align-items:center;gap:8px}
  .rpick{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--muted)}
  .rpick b{color:var(--text);font-weight:700}
  .rpick .rk{margin-right:3px}
  .rg .psub{font-variant-numeric:tabular-nums}
  .rg .psub.on{color:var(--text)}
  .why{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
  .why i{font-style:normal;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-right:6px}
  .tag.must{background:var(--accent);color:var(--accent-ink)}
  .tag.big{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.4s infinite}
  .rtabs{padding:12px 14px 0}
  .rtabs .seg{margin:0}
  .rnote{border-top:1px solid var(--line);padding:10px 14px 11px;font-size:12px;line-height:1.45;color:var(--dim)}
  .bx td:first-child,.bx th:first-child{text-align:left;padding-left:0;font-weight:600}
  .more{font-size:13px;font-weight:600;color:var(--accent)}
  a.news{display:block;padding:11px 14px;color:var(--text);text-decoration:none;border-top:1px solid var(--line)}
  a.news:first-child{border-top:0}
  a.news b{display:block;font-weight:600;font-size:15px;line-height:1.3}
  a.news span{display:block;margin-top:4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  a.news span i{font-style:normal;color:var(--accent);opacity:.85}

  /* Wide screens: tabs move up under the header */
  @media (min-width:720px){
    body{display:flex;flex-direction:column}
    header{order:0} .tabbar{order:1} main{order:2;width:100%}
    body.tabs{padding-bottom:0}
    .tabbar{position:static;border-top:0;border-bottom:1px solid var(--line)}
    .tab{flex-direction:row;gap:8px;align-items:baseline;justify-content:center;border-top:0;border-bottom:3px solid transparent;margin:0 0 -1px;padding:12px 0}
    .tab[aria-selected="true"]{border-bottom-color:var(--accent)}
  }
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <img class="mark" src="icons/iowa.svg" alt="" width="46" height="30">
    <div style="flex:1;min-width:0">
      <h1 id="title">IA Hawks</h1>
      <div class="eyebrow" id="eyebrow" style="margin-top:5px">Hawkeyes in the NFL</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <label class="weekwrap" id="weekwrap"><div class="week" id="week">Week —</div><select id="weekSel" aria-label="Choose a week" hidden></select></label>
      <select class="school" id="school" aria-label="School" hidden></select>
    </div>
  </div>
</header>

<main class="wrap">
 <p class="tagline" id="tagline"></p>
 <section id="saturday" hidden></section>
 <section id="sunday">
  <div class="stats" id="stats"></div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a player" autocomplete="off">
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter games"></div>
  <div id="notice"></div>
  <div id="content"><div class="loading">Loading this week's games…</div></div>
 </section>
  <footer id="footer"></footer>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Player season" hidden></div>
<noscript><p style="padding:20px;color:#F2F2F2">IA Hawks needs JavaScript to load scores and stats. Please turn it on and reload.</p></noscript>
<nav class="tabbar" id="tabbar" hidden>
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="saturday" aria-selected="false"><span>Saturday<i class="lv" id="satLive" hidden></i></span><small>College</small></button>
    <button class="tab" role="tab" data-tab="sunday" aria-selected="true"><span>Sunday<i class="lv" id="sunLive" hidden></i></span><small>NFL</small></button>
  </div>
</nav>

<script>
const TEAMS = {
  ARI:["Arizona","Cardinals","#97233F"], ATL:["Atlanta","Falcons","#A71930"], BAL:["Baltimore","Ravens","#241773"],
  BUF:["Buffalo","Bills","#00338D"], CAR:["Carolina","Panthers","#0085CA"], CHI:["Chicago","Bears","#0B162A"],
  CIN:["Cincinnati","Bengals","#FB4F14"], CLE:["Cleveland","Browns","#FF3C00"], DAL:["Dallas","Cowboys","#003594"],
  DEN:["Denver","Broncos","#FB4F14"], DET:["Detroit","Lions","#0076B6"], GB:["Green Bay","Packers","#203731"],
  HOU:["Houston","Texans","#03202F"], IND:["Indianapolis","Colts","#002C5F"], JAX:["Jacksonville","Jaguars","#006778"],

function fmtCats(cats){
  const out = [];
  const add = (cond, text) => { if(cond) out.push(text); };
  const c = k => cats[k] || null;
  let x;
  if((x = c("passing"))){ const ca = pick(x,"C/ATT"), y = pick(x,"YDS"), td = pick(x,"TD"), i = pick(x,"INT");
    add(ca, `${ca} · ${y} yds${num(td) ? ` · ${td} TD` : ""}${num(i) ? ` · ${i} INT` : ""}`); }
  if((x = c("rushing"))){ const n = pick(x,"CAR"), y = pick(x,"YDS"), td = pick(x,"TD");
    add(num(n), `${n} car · ${y} yds${num(td) ? ` · ${td} TD` : ""}`); }
  if((x = c("receiving"))){ const n = pick(x,"REC"), y = pick(x,"YDS"), td = pick(x,"TD"), t = pick(x,"TGTS");
    add(num(n) || num(t), `${n} rec${t !== undefined ? `/${t} tgt` : ""} · ${y} yds${num(td) ? ` · ${td} TD` : ""}`); }
  if((x = c("defensive"))){ const parts = [];
    const t = pick(x,"TOT"), sk = pick(x,"SACKS"), tfl = pick(x,"TFL"), pd = pick(x,"PD"), qh = pick(x,"QB HTS"), td = pick(x,"TD");
    if(num(t)) parts.push(`${t} tkl`); if(num(sk)) parts.push(`${sk} sack${num(sk) === 1 ? "" : "s"}`);
    if(num(tfl)) parts.push(`${tfl} TFL`); if(num(pd)) parts.push(`${pd} PD`); if(num(qh)) parts.push(`${qh} QB hit${num(qh) === 1 ? "" : "s"}`);
    if(num(td)) parts.push(`${td} TD`);

  if((x = c("interceptions"))){ const i = pick(x,"INT"), td = pick(x,"TD"); add(num(i), `${i} INT${num(td) ? " (pick-six!)" : ""}`); }
  if((x = c("fumbles"))){ const l = pick(x,"LOST"); add(num(l), `${l} fumble lost`); }
  if((x = c("kicking"))){ const fg = pick(x,"FG"), xp = pick(x,"XP"), lg = pick(x,"LONG");
    add(fg || xp, [fg && `FG ${fg}`, num(lg) ? `long ${lg}` : "", xp && `XP ${xp}`].filter(Boolean).join(" · ")); }

function parseScoreboard(sb){

    const comp = ev.competitions[0], sides = {};
    for(const c of comp.competitors){
      sides[c.homeAway] = {abbr: norm(c.team.abbreviation), score: c.score === "" || c.score == null ? null : +c.score};
    }
    const st = (ev.status || {}).type || {};
    const b = (comp.broadcasts || [])[0];
    const watch = (comp.geoBroadcasts || []).map(x => ({name:(x.media || {}).shortName, type:((x.type || {}).shortName) || "TV"})).filter(x => x.name);
    return {...(watch.length && st.state !== "post" ? {watch} : {}), id: ev.id, kickoff: ev.date, state: st.state || "pre", detail: st.state === "pre" ? "" : (st.shortDetail || ""),

}
function parseSummary(sum, tracked){

    const team = norm((tp.team || {}).abbreviation);
    for(const cat of (tp.statistics || [])){
      const labels = cat.labels || [];
      for(const a of (cat.athletes || [])){
        const k = (state.byId || {})[String((a.athlete || {}).id)] || normName((a.athlete || {}).displayName);
        if(!tracked.has(k)) continue;
        const e = found[k] || (found[k] = {team, id:(a.athlete || {}).id, cats:{}});
        e.cats[cat.name || "other"] = Object.fromEntries(labels.map((l,i) => [l, (a.stats || [])[i]]));

}

async function syncDirect(){

    const sb = await getJSON(`${ESPN}/scoreboard`, false);
    const fresh = parseScoreboard(sb);
    const wk = sb.week && sb.week.number;
    if(state.past || (wk && wk !== state.week.week)) return false;          // ESPN rolled to a new week; leave it to the daily refresh
    const byId = Object.fromEntries(fresh.map(g => [g.id, g]));
    state.week.games = state.week.games.map(g => byId[g.id] ? {...g, ...byId[g.id]} : g);
    const tracked = new Set(state.players.map(p => normName(p.name)));
    const teams = new Set(state.players.map(p => p.team));
    await Promise.all(state.week.games.filter(g => g.state === "in" && (teams.has(norm(g.away.abbr)) || teams.has(norm(g.home.abbr))))

/* Search: punctuation and accents are ignored ("tj" and "t.j." both find T.J. Hockenson and TJ Hall), words match
   from their start (so "tj" doesn't find Wetjen), and it also understands teams, positions, jersey numbers,
   initials ("gk") and one-letter typos in longer words. */
const fold = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
const POS_WORDS = {QB:"quarterback", RB:"running back", FB:"fullback", WR:"wide receiver", TE:"tight end", K:"kicker", P:"punter", LS:"long snapper",
  LB:"linebacker", ILB:"linebacker", OLB:"linebacker", DB:"defensive back safety cornerback corner", CB:"cornerback corner defensive back", S:"safety defensive back",
  DL:"defensive line lineman", DE:"defensive end lineman", DT:"defensive tackle lineman", OL:"offensive line lineman", T:"tackle offensive lineman",
  OT:"tackle offensive lineman", G:"guard offensive lineman", OG:"guard offensive lineman", C:"center offensive lineman"};
function near(a, b){                       // true if a and b differ by at most one edit
  if(a === b) return true;
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++edits > 1) return false;
    if(a.length > b.length) i++; else if(b.length > a.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
const wordHit = (tok, w) => w.startsWith(tok) || (tok.length >= 5 && (near(tok, w.slice(0, tok.length)) || near(tok, w.slice(0, tok.length + 1)) || near(tok, w.slice(0, tok.length - 1))));

  return [fold(p.name), fold(t), fold(team[0]), fold(team[1]), fold(p.pos), POS_WORDS[p.pos] || "", p.num != null ? String(p.num) : ""].join(" ").split(" ").filter(Boolean);
}
function matchesQ(p){
  const qt = state.qt || [];

  const words = searchWords(p), nameWords = fold(p.name).split(" ");
  if(qt.every(tok => (tok.length === 1 ? nameWords : words).some(w => wordHit(tok, w)))) return true;   // one letter: names only
  return qt.length === 1 && qt[0].length >= 2 && fold(p.name).split(" ").map(w => w[0]).join("").startsWith(qt[0]);   // initials

function hl(name){
  const qt = state.qt || [];
  if(!qt.length) return esc(name);
  return name.split(" ").map(word => {
    const fw = fold(word), tok = qt.find(t => fw && wordHit(t, fw));
    if(!tok) return esc(word);
    let need = Math.min(tok.length, fw.length), cut = 0;          // highlight as many letters as were typed, skipping punctuation
    while(cut < word.length && need > 0){ if(fold(word[cut])) need--; cut++; }
    while(cut < word.length && !fold(word[cut]) && /[.']/.test(word[cut]) && fw.length <= tok.length) cut++;
    return "<mark>" + esc(word.slice(0, cut)) + "</mark>" + esc(word.slice(cut));
  }).join(" ");
}

    for(const cat of (tp.statistics || [])){

               : Date.now() > new Date(g.kickoff) ? "Kicked off · updating"
               : `${esc(new Date(g.kickoff).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}))}${g.network ? " · " + esc(g.network) : ""}`;
    const tag = g.state === "post" && pick && g.winner ? (g.winner === pick.id ? `<span class="tag win">Went ${esc(school().name)}'s way</span>` : `<span class="tag loss">Didn't help</span>`)
              : `<span class="tag ${esc(g.level)}">${esc(ROOT_TAG[g.level] || "")}</span>`;
    return `<div class="rg"><div class="rhead">${head}${tag}</div>
      <span class="psub ${g.state === "pre" ? "" : "on"}">${when}</span>
      <p class="why">${esc(g.why)}</p></div>`;
  };
  return `<div class="section-h">Who to root for</div><div class="game root">${tabs}
    <div class="p" role="button" tabindex="0" aria-expanded="${open}" data-cg="rootclosed"><span class="pmain">
      ${(open ? r.summary : r.summary.slice(0, 1)).map(l => `<span class="rsum">${esc(l)}</span>`).join("")}
      ${open ? "" : `<span class="psub">${plural((r.games || []).length, "games")}${left && left < r.games.length ? `, ${left} still to play` : ""} · tap to open</span>`}</span>${CHEV}</div>
    ${open ? (r.games || []).map(row).join("") + (r.note ? `<div class="rnote">${esc(r.note)} Worked out ${esc(fmtTime(when))}.</div>` : "") : ""}</div>`;
}
// "Brown 173 pass yds · Phillips Jr. 76 rush yds · Vonnahme 61 rec yds": the leader of each, by last name.
function statPreview(tops){
  const kinds = {Pass:"pass", Rush:"rush", Rec:"rec"}, seen = new Set();
  return tops.filter(t => kinds[t.tag] && !seen.has(t.tag) && seen.add(t.tag)).map(t => {
    const yds = (String(t.line).match(/(-?\d+) yds/) || [])[1];
    const parts = String(t.name).split(" "), last = parts.slice(/^(jr|sr|ii|iii|iv)\.?$/i.test(parts.at(-1)) ? -2 : -1).join(" ");
    return yds != null ? `${last} ${yds} ${kinds[t.tag]} yds` : null;
  }).filter(Boolean).join(" · ");
}
function collegeCard(g){
  const box = state.college.box[g.id], key = "f:" + g.id, open = state.copen.has(key);
  const row = (side, other, mine) => `<div class="trow">${ncaaLogo(side.id || (mine && state.college.team.id)) || `<span class="dot" style="background:${mine ? "var(--accent)" : "#555"}"></span>`}
    <span class="tname">${rk(side)}<b>${esc(side.abbr)}</b><span>${esc(side.name || "")}</span></span>
    ${g.state !== "pre" && side.score != null ? `<span class="score ${g.state === "post" && side.score < other.score ? "lose" : ""}">${esc(side.score)}</span>` : ""}</div>`;
  const usRow = row(g.us, g.opp, true), oppRow = row(g.opp, g.us, false);
  const tops = topPerformers(box), abbr = state.college.team.abbr || "";
  const skey = "ps:" + g.id, sopen = state.copen.has(skey);     // player stats start folded; the preview shows the leaders
  const place = g.where === "home" ? "Home" : g.where === "away" ? "Away" : "Neutral site";
  return `<article class="game ${g.state === "in" ? "live" : ""}">
    <div class="gtop">${collegeStatus(g)}<span class="count">${esc(place)}</span></div>
    <div class="teams">${g.where === "home" ? oppRow + usRow : usRow + oppRow}</div>
    ${watchHTML(g, "college")}
    ${g.state === "pre" ? "" : `<div class="players">
      <div class="p" role="button" tabindex="0" aria-expanded="${sopen}" data-cg="${esc(skey)}"><span class="pmain"><span class="pname">${esc(abbr)} player stats</span>
        <span class="psub">${esc(statPreview(tops) || (g.state === "in" ? "Updating as the game goes" : "Box score"))}</span></span>${CHEV}</div>
      ${sopen ? tops.map(t => `<div class="p static"><span class="pos cat">${esc(t.tag)}</span><span class="pmain"><span class="pname">${esc(t.name)}</span><span class="sl">${esc(t.line)}</span></span></div>`).join("")
        + `<div class="p" role="button" tabindex="0" aria-expanded="${open}" data-cg="${esc(key)}"><span class="pmain more">Full ${esc(abbr)} box score</span>${CHEV}</div>
      ${open ? `<div class="detail wide">${fullBox(box, g, key)}</div>` : ""}` : ""}</div>`}
  </article>`;
}
function scheduleRow(g){
  const key = "s:" + g.id, open = state.copen.has(key), played = g.state !== "pre";
  const [mon, day] = fmtDay(g.kickoff).split(" ");
  const res = g.state === "post" ? `<span class="tag res ${g.win ? "win" : "loss"}">${g.win ? "W" : "L"} ${esc(g.us.score)}-${esc(g.opp.score)}</span>`
            : g.state === "in" ? `<span class="tag res inj">${esc(g.us.score)}-${esc(g.opp.score)}</span>` : "";
  const sub = g.state === "pre" ? `${new Date(g.kickoff).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"})}${g.network ? " · " + g.network : ""}`
            : g.state === "in" ? `Live · ${g.detail}` : "";
  return `<div class="p ${played ? "" : "static"}" ${played ? `role="button" tabindex="0" aria-expanded="${open}" data-cg="${esc(key)}"` : ""}>
    <span class="pos date">${esc(mon)}<br>${esc(day || "")}</span>
    <span class="pmain"><span class="pname">${g.where === "away" ? "@ " : "vs "}${ncaaLogo(g.opp.id, "sm")}${rk(g.opp)}${esc(g.opp.name || g.opp.abbr)}</span>${sub ? `<span class="psub">${esc(sub)}</span>` : ""}</span>
    ${res}${played ? CHEV : ""}</div>${open ? `<div class="detail wide">${fullBox(state.college.box[g.id], g, key)}</div>` : ""}`;
}
// "CFP ranking · AP #13": the first poll is the headline number, the rest follow.
function rankLabel(t){
  const polls = t.polls || [];
  if(!polls.length) return t.rank ? "National ranking" : "Not ranked";
  const [first, ...rest] = polls;
  return `${esc(first.poll)} ${first.rank ? "ranking" : "(unranked)"}` + rest.map(p => `<br>${esc(p.poll)} ${p.rank ? "#" + esc(p.rank) : "unranked"}`).join("");
}
function renderSaturday(){
  const c = state.college, s = school(), t = c.team || {}, games = c.games || [];
  $("week").textContent = t.record || "—";
  const live = games.find(g => g.state === "in");
  const next = games.find(g => g.state === "pre");
  const last = [...games].reverse().find(g => g.state === "post");
  const [place, conf] = (t.standing || "").split(" in ");
  let html = `<div class="stats">
    <div class="stat"><b>${esc(t.record || "—")}</b><span>Record</span></div>
    <div class="stat"><b>${t.rank ? "#" + esc(t.rank) : "NR"}</b><span>${rankLabel(t)}</span></div>
    <div class="stat"><b>${esc(place || "—")}</b><span>${conf ? "in the " + esc(conf) : "Conference"}</span></div></div>`;
  if(!games.length) html += `<div class="empty">The ${esc(c.season || "")} schedule isn't out yet. Games, stats and leaders appear here once it is.</div>`;
  const sec = (h, g) => g ? `<div class="section-h">${h}</div>${collegeCard(g)}` : "";
  const lastFresh = last && Date.now() - new Date(last.kickoff) < 40*3600e3;
  const root = games.length ? rootingHTML() : "";      // sits between the two game cards
  if(live) html += sec("Live now", live) + root + sec("Last game", last);
  else if(lastFresh) html += sec("Last game", last) + root + sec("Next up", next);
  else html += sec("Next up", next) + root + sec("Last game", last);

  if((c.leaders || []).length) html += `<div class="section-h">Season leaders</div><div class="game"><div class="players" style="border-top:0">${
    c.leaders.map(l => { const [a, ...rest] = l.players;
      return `<div class="p static"><span class="pos cat">${esc(LEADER_TAG[l.label] || l.label.slice(0,4))}</span><span class="pmain">
        <span class="pname">${esc(a.name)}</span><span class="sl">${esc(leaderLine(a.line))}</span>
        ${rest.length ? `<span class="psub">${rest.map(r => `${esc(r.name)} ${esc(r.value)}`).join(" · ")}</span>` : ""}</span></div>`; }).join("")}</div></div>`;

  if(games.length) html += `<div class="section-h">Schedule</div><div class="game"><div class="players" style="border-top:0">${games.map(scheduleRow).join("")}</div></div>`;

  const news = (c.news || []).slice(0, 14);
  if(news.length) html += `<div class="section-h">${esc(s.name)} football news</div><div class="game">${news.map(a =>
    `<a class="news" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener"><b>${esc(a.headline)}</b><span><i>${esc(a.source || "ESPN")}</i> · ${esc(fmtDay(a.published))}</span></a>`).join("")}</div>`;
  $("saturday").innerHTML = html;

  $("footer").innerHTML = `<span class="sync ${state.collegeSync ? "on" : ""}">${state.collegeSync ? `Live · synced ${esc(fmtTime(state.collegeSync))}` : `Updated ${esc(fmtTime(c.updated))}`}</span><br>
    ${(c.team.polls || []).map(p => `${esc(p.name)}${p.week ? ", " + esc(p.week) : ""}, updated ${esc(fmtDay(p.asOf))}`).join(" · ")}${(c.team.polls || []).length ? ".<br>" : ""}
    Season leaders are added up from each game's box score, so they can differ slightly from official totals.<br>
    Scores and stats: ESPN. Headlines link to the outlets that wrote them.<br>${FOOT}`;
}

function renderSunday(){
  const w = state.week, s = school();
  const games = (w.games || []).map(g => ({...g, away:{...g.away, abbr:norm(g.away.abbr)}, home:{...g.home, abbr:norm(g.home.abbr)}}))
    .sort((a,b) => ORDER[a.state] - ORDER[b.state] || new Date(a.kickoff) - new Date(b.kickoff));
  const offseason = !games.length;
  const weekLabel = x => x.label || (x.seasonType === "post" ? "Playoffs" : x.seasonType === "pre" ? "Preseason" : `Week ${x.week}`);
  $("week").textContent = offseason ? "Offseason" : weekLabel(w);
  // Week picker: a native select laid invisibly over the badge.
  const lw = state.live ? state.live.week : w, lkey = `${({pre:1, regular:2, post:3})[lw.seasonType] || 2}-${lw.week}`;
  const olds = ((state.weeks || {}).weeks || []).filter(x => x.key !== lkey).reverse();
  const sel = $("weekSel"), pick = olds.length > 0 && state.tab !== "saturday";
  $("weekwrap").classList.toggle("pick", pick); sel.hidden = !pick;
  if(pick){
    sel.innerHTML = `<option value="">${esc((lw.games || []).length ? weekLabel(lw) : "Offseason")} (this week)</option>` + olds.map(x => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join("");
    sel.value = state.past ? state.past.key : "";
  }
  const byes = (w.byes || []).map(norm);
  const playing = new Set(games.flatMap(g => [g.away.abbr, g.home.abbr]));
  const liveCount = games.filter(g => g.state === "in").length;
  const toPlay = games.filter(g => g.state === "pre").length;

  $("stats").innerHTML = `
    <div class="stat"><b>${state.players.length}</b><span>${esc(s.nickname)} on NFL rosters</span></div>
    <div class="stat"><b>${state.past ? Object.keys(state.pastTeam).length : offseason ? new Set(state.players.map(p=>p.team)).size : state.players.filter(p => playing.has(p.team) && !isOut(p)).length}</b>
      <span>${state.past ? "Recorded a stat that week" : offseason ? "NFL teams with one" : "Active in this week's games"}</span></div>
    <div class="stat"><b>${state.past ? games.length : offseason ? "—" : liveCount || toPlay}</b><span>${state.past ? "Games that week" : offseason ? "No games this week" : liveCount ? "Games live now" : "Games still to play"}</span></div>`;

  const counts = {all: games.length, live: liveCount, pre: toPlay, post: games.filter(g => g.state === "post").length,
                  bye: byes.length, roster: state.players.length};
  const extra = !state.past;
  const defs = [["all","Games"],["live","Live"],["pre","Upcoming"],["post","Final"],["bye","Byes"],["roster","All players"],["leaders","Leaders"],["moves","Moves"]]
    .filter(([k]) => k === "roster" || (k === "leaders" ? extra && state.season : k === "moves" ? extra && state.moves : !offseason && (k === "all" || counts[k])));
  counts.moves = ((state.moves || {}).moves || []).length;
  if(!state.filter || !defs.some(([k]) => k === state.filter)) state.filter = offseason ? "roster" : (liveCount ? "all" : "all");
  const chipScroll = $("chips").scrollLeft;
  $("chips").innerHTML = defs.map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${l}${counts[k] != null && (k !== "moves" || counts[k]) ? `<span class="n">${counts[k]}</span>` : ""}</button>`).join("");

  $("chips").scrollLeft = chipScroll;                       // re-rendering shouldn't jump the row back to the start
  const onChip = $("chips").querySelector('[aria-pressed="true"]');
  if(onChip && state.chipMoved){ onChip.scrollIntoView({inline:"center", block:"nearest"}); state.chipMoved = false; }
  chipFade();

  // stale / delayed notice
  const updated = state.direct ? state.lastSync : new Date(w.updated);
  const stale = liveCount && !state.direct && Date.now() - new Date(w.updated) > 40*60e3;
  $("notice").innerHTML = state.past ? `<div class="warn pastbar"><span>Looking back at <b>${esc(weekLabel(w))}</b>. Players are shown with the team they played for that week.</span><button id="backNow">This week</button></div>` : stale ? `<div class="warn">Scores last updated ${esc(fmtTime(w.updated))}. They may be a few minutes behind while games are live.</div>` : "";

  const has = g => playersFor(g.away.abbr).length + playersFor(g.home.abbr).length > 0;
  const f = state.filter;
  let html = "";
  const anyOut = !state.past && state.players.some(isOut);
  if(anyOut && f !== "leaders" && f !== "moves") html += `<div class="key"><i></i>Dimmed players aren't expected to play: on a reserve list, on the practice squad, or ruled out.</div>`;
  $("q").parentElement.hidden = f === "leaders" || f === "moves";
  const hits = state.q ? state.players.filter(matchesQ).length : 0;
  if(f === "leaders") html = leadersView();
  else if(f === "moves") html = movesView();
  else if(state.q) html = (hits ? `<div class="key">${esc(plural(hits, s.nickname))} ${hits === 1 ? "matches" : "match"} “${esc(state.q)}”</div>` : "") + rosterView(games);
  else if(f === "roster") html += rosterView(games);
  else if(f !== "bye"){
    const shown = games.filter(g => f === "all" || g.state === f);
    const withP = shown.filter(g => has(g) && (!state.q || [...playersFor(g.away.abbr), ...playersFor(g.home.abbr)].some(matchesQ)));
    const without = shown.filter(g => !has(g));
    html += withP.length ? `<div class="list">${withP.map(gameCard).join("")}</div>`
                         : `<div class="empty">No ${esc(s.nickname)} match${state.q ? ` “${esc(state.q)}”` : ""} here.</div>`;
    if(without.length && !state.q)
      html += `<div class="section-h">No ${esc(s.nickname)}</div><div class="none">${without.map(g => `${esc(g.away.abbr)} @ ${esc(g.home.abbr)}`).join(" · ")}</div>`;
  }
  if((f === "all" || f === "bye") && byes.length && !state.q){
    const byeP = byes.flatMap(t => playersFor(t)).filter(matchesQ);
    if(byeP.length || !state.q){
      html += `<div class="section-h">On a bye</div>`;
      html += byeP.length
        ? `<div class="game"><div class="players" style="border-top:0">${byes.map(t => {
            const l = playersFor(t).filter(matchesQ);
            return l.length ? `<div class="pteam">${esc(t)} · ${esc((TEAMS[t]||[])[1]||"")}</div>${l.map(p => playerRow(p)).join("")}` : "";
          }).join("")}</div></div>`
        : `<div class="none">Byes: ${byes.join(", ")}. No ${esc(s.nickname)} on those teams.</div>`;
    }
  }
  $("content").innerHTML = html;

  if(state.past){
    $("footer").innerHTML = `${esc(weekLabel(w))}, ${esc(w.season)} season · final.<br>
      Roster status and injury tags aren't kept for past weeks, and players without a stat line are listed with their current team.<br>
      Data: <a href="https://sleeper.com" target="_blank" rel="noopener">Sleeper</a> rosters, ESPN scores and box scores.<br>${FOOT}`;
    return;
  }
  $("footer").innerHTML = `<span class="sync ${state.direct ? "on" : ""}">${state.direct ? `Live · synced ${esc(fmtTime(state.lastSync))}` : `Scores updated ${esc(fmtTime(updated))}`}</span>
    · Rosters updated ${esc(fmtTime(state.playersUpdated))}.<br>
    “College” is the last school a player attended.<br>
    Data: <a href="https://sleeper.com" target="_blank" rel="noopener">Sleeper</a> rosters, ESPN scores and box scores.<br>${FOOT}`;
}

$("content").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const pl = e.target.closest("[data-player]"); if(pl) return openPlayer(pl.dataset.player);
  const el = e.target.closest(".p[data-k]"); if(el) toggle(el);
});
$("content").addEventListener("keydown", e => {
  const pl = e.target.closest("[data-player]");
  if(pl && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); return openPlayer(pl.dataset.player); }
  const el = e.target.closest(".p[data-k]");
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggle(el); }
});
function toggleCollege(el){
  const k = el.dataset.cg; if(state.copen.has(k)) state.copen.delete(k); else state.copen.add(k);
  if(k === "rootclosed") try{ localStorage.setItem("rootclosed", state.copen.has(k) ? "1" : ""); }catch(e){}
  render();
}
try{ if(localStorage.getItem("rootclosed")) state.copen.add("rootclosed"); state.rootView = localStorage.getItem("rootview") || null; }catch(e){}
$("saturday").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const rv = e.target.closest("[data-rv]");
  if(rv){ state.rootView = rv.dataset.rv; try{ localStorage.setItem("rootview", rv.dataset.rv); }catch(_){} return render(); }
  const sb = e.target.closest(".seg button");
  if(sb){ state.boxSide[sb.parentElement.dataset.seg] = sb.dataset.side; return render(); }
  const el = e.target.closest("[data-cg]"); if(el) toggleCollege(el);
});
$("sheet").addEventListener("click", e => { if(e.target.closest("#sheetClose")) history.back(); });
window.addEventListener("popstate", () => { if(state.player) closePlayer(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && state.player) history.back(); });
$("saturday").addEventListener("keydown", e => {
  const el = e.target.closest("[data-cg]");
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleCollege(el); }
});
$("tabbar").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b || b.dataset.tab === state.tab) return;
  state.tab = b.dataset.tab;
  const sch = hashParts().school;
  history.replaceState(null, "", "#" + (sch ? sch + "/" : "") + state.tab);
  render(); window.scrollTo(0, 0);
});
$("weekSel").addEventListener("change", e => showWeek(e.target.value).catch(showErr));
$("notice").addEventListener("click", e => { if(e.target.closest("#backNow")) showWeek("").catch(showErr); });
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; state.filter = b.dataset.f; state.chipMoved = true; render(); });
function chipFade(){
  const c = $("chips"), max = c.scrollWidth - c.clientWidth;
  c.classList.toggle("more-r", max > 4 && c.scrollLeft < max - 4);
  c.classList.toggle("more-l", max > 4 && c.scrollLeft > 4);
}
$("chips").addEventListener("scroll", chipFade, {passive:true});
window.addEventListener("resize", chipFade);
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); state.qt = fold(state.q).split(" ").filter(Boolean); render(); });
$("school").addEventListener("change", e => { location.hash = e.target.value; });
window.addEventListener("hashchange", () => loadSchool().catch(showErr));
function showErr(e){
  $("saturday").hidden = true; $("sunday").hidden = false;
  $("content").innerHTML = `<div class="err">Couldn't load the latest data. Check your connection and try again.<br><br>
    <button class="close" onclick="location.reload()">Try again</button><div style="margin-top:10px;font-size:12px;opacity:.7">${esc(e && e.message || "")}</div></div>`;
}

(async function init(){
  try{
    const [schools, week, stats, weeks] = await Promise.all([getJSON("schools.json"), getJSON("data/week.json"), getJSON("data/stats.json").catch(() => null),
      getJSON("data/weeks/index.json").catch(() => null)]);
    state.weeks = weeks && weeks.season === week.season ? weeks : null;
    state.schools = schools; state.week = week; state.stats = (stats && stats.week === week.week && stats.games) || {};
    const keys = Object.keys(schools.schools);
    if(keys.length > 1){
      const sel = $("school");
      sel.innerHTML = keys.map(k => `<option value="${k}">${esc(schools.schools[k].name)}</option>`).join("");
      sel.hidden = false;
    }
    await loadSchool();
    if(liveWindow() && await syncDirect()) render();
    if(collegeLive() && await syncCollege()) render();
    if(rootLive().length && await syncRooting()) render();
    schedule();
  }catch(e){ showErr(e); }
})();
