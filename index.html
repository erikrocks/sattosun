<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Hawkeyes on Saturday and Sunday</title>
<meta name="description" content="Iowa football on Saturday, every former Hawkeye in the NFL on Sunday: live scores, stat lines, news and roster status.">
<meta property="og:title" content="Hawkeyes on Saturday and Sunday">
<meta property="og:description" content="Iowa football on Saturday, every former Hawkeye in the NFL on Sunday: live scores, stat lines, news and roster status.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#FFCD00; --accent-ink:#000; --bg:#0A0A0A; --card:#151515; --line:#2A2A2A;
    --text:#F2F2F2; --muted:#9A9A9A; --dim:#6B6B6B; --live:#FF4D4D;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:3px solid var(--accent)}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 10px}
  .eyebrow{font:700 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{margin:4px 0 0;font:800 28px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em}
  .week{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;
    font:800 15px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;padding:8px 12px;letter-spacing:.04em;white-space:nowrap}
  .weekwrap{position:relative;display:block}
  .weekwrap select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .weekwrap.pick .week::after{content:"";display:inline-block;margin-left:7px;vertical-align:2px;
    border:4px solid transparent;border-top:5px solid currentColor;border-bottom:0}
  .pastbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pastbar button{flex:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
  select.school{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 9px}
  .stat b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--accent)}
  .stat span{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.2}

  /* Controls */
  .search{position:relative;margin-bottom:10px}
  .search input{accent-color:var(--accent);width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px 14px 12px 40px;font-size:16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip .n{opacity:.7;margin-left:4px;font-weight:500}

  /* Game cards */
  .list{display:flex;flex-direction:column;gap:12px;padding:8px 0 20px}
  .game{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .game.live{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .gtop{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;font-size:12px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .gtop .lv{color:var(--live);display:inline-flex;align-items:center;gap:6px}
  .gtop .lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .count{color:var(--accent)}
  .teams{padding:8px 14px 10px}
  .trow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname b{font:700 20px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin-right:6px}
  .tname span{color:var(--muted);font-size:14px}
  .score{font:800 24px/1 "Barlow Condensed",sans-serif;min-width:34px;text-align:right}
  .score.lose{color:var(--dim)}
  .players{border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
  .pteam{padding:9px 14px 2px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .p{display:flex;align-items:center;gap:10px;padding:7px 14px}
  .pos{flex:none;width:40px;text-align:center;font:700 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;
    border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:4px 0}
  .pname{font-weight:600;font-size:15px}
  .pname .num{color:var(--dim);font-weight:500;margin-left:4px;font-size:13px}
  .tag{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:#262626;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em}
  .tag.inj{background:rgba(255,77,77,.15);color:#FF8A8A}
  .p.out .pname,.p.out .pos{opacity:.45}
  .pmain{flex:1;min-width:0}
  .pmain .pname{display:block}
  .sl{display:block;font-size:13px;color:var(--accent);opacity:.9;margin-top:2px}
  .sl.quiet{color:var(--dim)}
  .roster-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .roster-h em{font-style:normal;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted)}
  .sync{display:inline-flex;align-items:center;gap:6px}
  .sync.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc84;animation:pulse 2s infinite}
  .p{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .p:active{background:rgba(255,255,255,.03)}
  .chev{flex:none;width:16px;height:16px;opacity:.45;transition:transform .15s}
  .p[aria-expanded="true"] .chev{transform:rotate(180deg);opacity:.8}
  .detail{padding:2px 14px 14px 64px}
  .detail .msg{font-size:13px;color:var(--muted);padding:4px 0}
  .bx{margin:8px 0 0}
  .bx h4{margin:0 0 4px;font:700 11px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .bx .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bx table{border-collapse:collapse;font-size:13px;min-width:100%}
  .bx th{font-weight:600;color:var(--muted);text-align:center;padding:4px 8px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11px}
  .bx td{text-align:center;padding:6px 8px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .links{display:flex;gap:14px;margin-top:10px;font-size:13px}
  .links a{color:var(--accent);text-decoration:none;font-weight:600}
  .warn{background:rgba(255,205,0,.08);border:1px solid rgba(255,205,0,.35);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;margin:4px 0 8px}
  mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 2px}

  .section-h{margin:18px 2px 8px;font:800 18px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .none{background:transparent;border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;color:var(--muted);font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  footer{color:var(--dim);font-size:12px;padding:6px 2px 40px;line-height:1.6}
  footer a{color:var(--muted)}
  .err{background:#2a1515;border:1px solid #5a2a2a;color:#ffb3b3;border-radius:var(--radius);padding:14px;margin-top:14px}
  @media (min-width:560px){ h1{font-size:34px} .stat b{font-size:34px} }

  /* Bottom tabs */
  body.tabs{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .wrap{display:grid;grid-template-columns:1fr 1fr;padding:0}
  .tab{background:none;border:0;border-top:3px solid transparent;margin-top:-1px;padding:10px 0 9px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);-webkit-tap-highlight-color:transparent;
    font:800 19px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em}
  .tab small{font:600 10px/1 Inter,sans-serif;letter-spacing:.1em}
  .tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
  .tab .lv{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-left:6px;vertical-align:middle;animation:pulse 1.4s infinite}
  .tab .lv[hidden]{display:none}

  /* Saturday */
  .rk{font:700 12px/1 Inter,sans-serif;color:var(--muted);margin-right:5px;vertical-align:middle}
  .p.static{cursor:default}
  .p.static:active{background:none}
  .pos.cat{font-size:11px;border-color:var(--line);color:var(--muted)}
  .pos.date{width:48px;border:0;color:var(--muted);font-size:14px;line-height:1.15;padding:0}
  .psub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .tag.win{background:rgba(61,220,132,.14);color:#6fe3a5}
  .tag.loss{background:rgba(255,77,77,.15);color:#FF8A8A}
  .tag.res{font-size:13px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .detail.wide{padding-left:14px}
  .bx td:first-child,.bx th:first-child{text-align:left;padding-left:0;font-weight:600}
  .more{font-size:13px;font-weight:600;color:var(--accent)}
  a.news{display:block;padding:11px 14px;color:var(--text);text-decoration:none;border-top:1px solid var(--line)}
  a.news:first-child{border-top:0}
  a.news b{display:block;font-weight:600;font-size:15px;line-height:1.3}
  a.news span{display:block;margin-top:4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <div>
      <div class="eyebrow" id="eyebrow">NFL Alumni Tracker</div>
      <h1 id="title">Hawkeyes in the NFL</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <label class="weekwrap" id="weekwrap"><div class="week" id="week">Week —</div><select id="weekSel" aria-label="Choose a week" hidden></select></label>
      <select class="school" id="school" aria-label="School" hidden></select>
    </div>
  </div>
</header>

<main class="wrap">
 <section id="saturday" hidden></section>
 <section id="sunday">
  <div class="stats" id="stats"></div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find a player" autocomplete="off">
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter games"></div>
  <div id="notice"></div>
  <div id="content"></div>
 </section>
  <footer id="footer"></footer>
</main>
<nav class="tabbar" id="tabbar" hidden>
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="saturday" aria-selected="false"><span>Saturday<i class="lv" id="satLive" hidden></i></span><small>College</small></button>
    <button class="tab" role="tab" data-tab="sunday" aria-selected="true"><span>Sunday<i class="lv" id="sunLive" hidden></i></span><small>NFL</small></button>
  </div>
</nav>

<script>
const TEAMS = {
  ARI:["Arizona","Cardinals","#97233F"], ATL:["Atlanta","Falcons","#A71930"], BAL:["Baltimore","Ravens","#241773"],
  BUF:["Buffalo","Bills","#00338D"], CAR:["Carolina","Panthers","#0085CA"], CHI:["Chicago","Bears","#0B162A"],
  CIN:["Cincinnati","Bengals","#FB4F14"], CLE:["Cleveland","Browns","#FF3C00"], DAL:["Dallas","Cowboys","#003594"],
  DEN:["Denver","Broncos","#FB4F14"], DET:["Detroit","Lions","#0076B6"], GB:["Green Bay","Packers","#203731"],
  HOU:["Houston","Texans","#03202F"], IND:["Indianapolis","Colts","#002C5F"], JAX:["Jacksonville","Jaguars","#006778"],
  KC:["Kansas City","Chiefs","#E31837"], LV:["Las Vegas","Raiders","#A5ACAF"], LAC:["LA","Chargers","#0080C6"],
  LAR:["LA","Rams","#003594"], MIA:["Miami","Dolphins","#008E97"], MIN:["Minnesota","Vikings","#4F2683"],
  NE:["New England","Patriots","#002244"], NO:["New Orleans","Saints","#D3BC8D"], NYG:["New York","Giants","#0B2265"],
  NYJ:["New York","Jets","#125740"], PHI:["Philadelphia","Eagles","#004C54"], PIT:["Pittsburgh","Steelers","#FFB612"],
  SF:["San Francisco","49ers","#AA0000"], SEA:["Seattle","Seahawks","#69BE28"], TB:["Tampa Bay","Buccaneers","#D50A0A"],
  TEN:["Tennessee","Titans","#4B92DB"], WAS:["Washington","Commanders","#5A1414"]
};
const ALIAS = {WSH:"WAS", JAC:"JAX", LA:"LAR", ARZ:"ARI", OAK:"LV", SD:"LAC", STL:"LAR"};
const ORDER = {in:0, pre:1, post:2};
const OUT = /reserve|injured|ir\b|pup|suspend|nfi|practice|inactive/i;
const ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const ESPNC = "https://site.api.espn.com/apis/site/v2/sports/football/college-football";
const LIVE_BEFORE = 20*60e3, LIVE_AFTER = 5*3600e3;

const norm = a => ALIAS[(a||"").toUpperCase()] || (a||"").toUpperCase();
// Same rule as scripts/update.py: "T.J. Hockenson" == "TJ Hockenson", suffixes dropped.
const normName = n => (n||"").toLowerCase().replace(/-/g," ").replace(/[^a-z ]/g,"")
  .replace(/\b(jr|sr|ii|iii|iv|v)\b/g,"").split(/\s+/).filter(Boolean).join(" ");

const state = { schools:null, schoolKey:null, week:null, stats:{}, players:[], filter:null, q:"",
                direct:false, directTried:false, lastSync:null, open:new Set(), box:{},
                weeks:null, past:null, live:null, pastTeam:{},
                tab:"sunday", college:null, collegeSync:null, copen:new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const school = () => state.schools.schools[state.schoolKey];

async function getJSON(path, bust=true){
  const url = bust ? path + (path.includes("?") ? "&" : "?") + "t=" + Math.floor(Date.now()/60000) : path;
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}

/* ---------- stat lines ---------- */
const num = v => { const n = parseFloat(String(v).split("/")[0]); return isNaN(n) ? 0 : n; };
function pick(o, ...labels){ for(const l of labels){ for(const k in o){ if(k.toLowerCase() === l.toLowerCase()) return o[k]; } } return undefined; }
function fmtCats(cats){
  const out = [];
  const add = (cond, text) => { if(cond) out.push(text); };
  const c = k => cats[k] || null;
  let x;
  if((x = c("passing"))){ const ca = pick(x,"C/ATT"), y = pick(x,"YDS"), td = pick(x,"TD"), i = pick(x,"INT");
    add(ca, `${ca} · ${y} yds${num(td) ? ` · ${td} TD` : ""}${num(i) ? ` · ${i} INT` : ""}`); }
  if((x = c("rushing"))){ const n = pick(x,"CAR"), y = pick(x,"YDS"), td = pick(x,"TD");
    add(num(n), `${n} car · ${y} yds${num(td) ? ` · ${td} TD` : ""}`); }
  if((x = c("receiving"))){ const n = pick(x,"REC"), y = pick(x,"YDS"), td = pick(x,"TD"), t = pick(x,"TGTS");
    add(num(n) || num(t), `${n} rec${t !== undefined ? `/${t} tgt` : ""} · ${y} yds${num(td) ? ` · ${td} TD` : ""}`); }
  if((x = c("defensive"))){ const parts = [];
    const t = pick(x,"TOT"), sk = pick(x,"SACKS"), tfl = pick(x,"TFL"), pd = pick(x,"PD"), qh = pick(x,"QB HTS"), td = pick(x,"TD");
    if(num(t)) parts.push(`${t} tkl`); if(num(sk)) parts.push(`${sk} sack${num(sk) === 1 ? "" : "s"}`);
    if(num(tfl)) parts.push(`${tfl} TFL`); if(num(pd)) parts.push(`${pd} PD`); if(num(qh)) parts.push(`${qh} QB hit${num(qh) === 1 ? "" : "s"}`);
    if(num(td)) parts.push(`${td} TD`);
    add(parts.length, parts.join(" · ")); }
  if((x = c("interceptions"))){ const i = pick(x,"INT"), td = pick(x,"TD"); add(num(i), `${i} INT${num(td) ? " (pick-six!)" : ""}`); }
  if((x = c("fumbles"))){ const l = pick(x,"LOST"); add(num(l), `${l} fumble lost`); }
  if((x = c("kicking"))){ const fg = pick(x,"FG"), xp = pick(x,"XP"), lg = pick(x,"LONG");
    add(fg || xp, [fg && `FG ${fg}`, num(lg) ? `long ${lg}` : "", xp && `XP ${xp}`].filter(Boolean).join(" · ")); }
  if((x = c("punting"))){ const n = pick(x,"NO"), a = pick(x,"AVG"), i = pick(x,"In 20");
    add(num(n), `${n} punt${num(n) === 1 ? "" : "s"} · ${a} avg${num(i) ? ` · ${i} inside 20` : ""}`); }
  if((x = c("kickReturns"))){ const n = pick(x,"NO"), y = pick(x,"YDS"); add(num(n), `${n} KR · ${y} yds`); }
  if((x = c("puntReturns"))){ const n = pick(x,"NO"), y = pick(x,"YDS"); add(num(n), `${n} PR · ${y} yds`); }
  return out.join("  ·  ");
}
function statLine(p, g){
  if(!g || g.state === "pre") return "";
  const gs = boxFor(g);
  if(!gs) return "";
  const e = gs.players && gs.players[normName(p.name)];
  const line = e ? fmtCats(e.cats || {}) : "";
  if(line) return `<span class="sl">${esc(line)}</span>`;
  if(isOut(p)) return "";
  return `<span class="sl quiet">${/^(OT|OG|G|T|C|OL|LS)$/.test(p.pos) ? "No box-score stats for linemen" : g.state === "post" ? "No stats recorded" : "No stats yet"}</span>`;
}

/* ---------- direct ESPN (works on your own domain; blocked in the Claude preview) ---------- */
function parseScoreboard(sb){
  return (sb.events || []).map(ev => {
    const comp = ev.competitions[0], sides = {};
    for(const c of comp.competitors){
      sides[c.homeAway] = {abbr: norm(c.team.abbreviation), score: c.score === "" || c.score == null ? null : +c.score};
    }
    const st = (ev.status || {}).type || {};
    const b = (comp.broadcasts || [])[0];
    return {id: ev.id, kickoff: ev.date, state: st.state || "pre", detail: st.state === "pre" ? "" : (st.shortDetail || ""),
            network: b && b.names ? b.names[0] : "", away: sides.away, home: sides.home};
  });
}
function parseSummary(sum, tracked){
  const found = {};
  for(const tp of ((sum.boxscore || {}).players || [])){
    const team = norm((tp.team || {}).abbreviation);
    for(const cat of (tp.statistics || [])){
      const labels = cat.labels || [];
      for(const a of (cat.athletes || [])){
        const k = normName((a.athlete || {}).displayName);
        if(!tracked.has(k)) continue;
        const e = found[k] || (found[k] = {team, id:(a.athlete || {}).id, cats:{}});
        e.cats[cat.name || "other"] = Object.fromEntries(labels.map((l,i) => [l, (a.stats || [])[i]]));
      }
    }
  }
  return found;
}
function liveWindow(){
  const now = Date.now();
  return ((state.week || {}).games || []).some(g => g.state !== "post" &&
    now >= new Date(g.kickoff) - LIVE_BEFORE && now <= +new Date(g.kickoff) + LIVE_AFTER);
}
async function syncDirect(){
  if(state.past) return false;
  if(state.directTried && !state.direct) return false;
  state.directTried = true;
  try{
    const sb = await getJSON(`${ESPN}/scoreboard`, false);
    const fresh = parseScoreboard(sb);
    const wk = sb.week && sb.week.number;

  else if(lastFresh) html += sec("Last game", last) + sec("Next up", next);
  else html += sec("Next up", next) + sec("Last game", last);

  if((c.leaders || []).length) html += `<div class="section-h">Season leaders</div><div class="game"><div class="players" style="border-top:0">${
    c.leaders.map(l => { const [a, ...rest] = l.players;
      return `<div class="p static"><span class="pos cat">${esc(LEADER_TAG[l.label] || l.label.slice(0,4))}</span><span class="pmain">
        <span class="pname">${esc(a.name)}</span><span class="sl">${esc(leaderLine(a.line))}</span>
        ${rest.length ? `<span class="psub">${rest.map(r => `${esc(r.name)} ${esc(r.value)}`).join(" · ")}</span>` : ""}</span></div>`; }).join("")}</div></div>`;

  if(games.length) html += `<div class="section-h">Schedule</div><div class="game"><div class="players" style="border-top:0">${games.map(scheduleRow).join("")}</div></div>`;

  const about = a => new RegExp(`${s.name}|${s.nickname.replace(/s$/,"")}`, "i").test(`${a.headline} ${a.description || ""}`);
  const news = [...(c.news || [])].sort((a,b) => about(b) - about(a) || new Date(b.published) - new Date(a.published)).slice(0, 8);
  if(news.length) html += `<div class="section-h">News</div><div class="game">${news.map(a =>
    `<a class="news" href="${esc(a.url)}" target="_blank" rel="noopener"><b>${esc(a.headline)}</b><span>${esc(a.type === "HeadlineNews" ? "News" : a.type || "Story")} · ${esc(fmtDay(a.published))}</span></a>`).join("")}</div>`;
  $("saturday").innerHTML = html;

  $("footer").innerHTML = `<span class="sync ${state.collegeSync ? "on" : ""}">${state.collegeSync ? `Live · synced ${esc(fmtTime(state.collegeSync))}` : `Updated ${esc(fmtTime(c.updated))}`}</span><br>
    Season leaders are added up from each game's box score, so they can differ slightly from official totals.<br>
    Data and news: ESPN. Not affiliated with the NFL or any school.`;
}

function renderSunday(){
  const w = state.week, s = school();
  const games = (w.games || []).map(g => ({...g, away:{...g.away, abbr:norm(g.away.abbr)}, home:{...g.home, abbr:norm(g.home.abbr)}}))
    .sort((a,b) => ORDER[a.state] - ORDER[b.state] || new Date(a.kickoff) - new Date(b.kickoff));
  const offseason = !games.length;
  const weekLabel = x => x.label || (x.seasonType === "post" ? "Playoffs" : x.seasonType === "pre" ? "Preseason" : `Week ${x.week}`);
  $("week").textContent = offseason ? "Offseason" : weekLabel(w);
  // Week picker: a native select laid invisibly over the badge.
  const lw = state.live ? state.live.week : w, lkey = `${({pre:1, regular:2, post:3})[lw.seasonType] || 2}-${lw.week}`;
  const olds = ((state.weeks || {}).weeks || []).filter(x => x.key !== lkey).reverse();
  const sel = $("weekSel"), pick = olds.length > 0 && state.tab !== "saturday";
  $("weekwrap").classList.toggle("pick", pick); sel.hidden = !pick;
  if(pick){
    sel.innerHTML = `<option value="">${esc((lw.games || []).length ? weekLabel(lw) : "Offseason")} (this week)</option>` + olds.map(x => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join("");
    sel.value = state.past ? state.past.key : "";
  }
  const byes = (w.byes || []).map(norm);
  const playing = new Set(games.flatMap(g => [g.away.abbr, g.home.abbr]));
  const liveCount = games.filter(g => g.state === "in").length;
  const toPlay = games.filter(g => g.state === "pre").length;

  $("stats").innerHTML = `
    <div class="stat"><b>${state.players.length}</b><span>${esc(s.nickname)} on NFL rosters</span></div>
    <div class="stat"><b>${state.past ? Object.keys(state.pastTeam).length : offseason ? new Set(state.players.map(p=>p.team)).size : state.players.filter(p => playing.has(p.team) && !isOut(p)).length}</b>
      <span>${state.past ? "Recorded a stat that week" : offseason ? "NFL teams with one" : "Active in this week's games"}</span></div>
    <div class="stat"><b>${state.past ? games.length : offseason ? "—" : liveCount || toPlay}</b><span>${state.past ? "Games that week" : offseason ? "No games this week" : liveCount ? "Games live now" : "Games still to play"}</span></div>`;

  const counts = {all: games.length, live: liveCount, pre: toPlay, post: games.filter(g => g.state === "post").length,
                  bye: byes.length, roster: state.players.length};
  const defs = [["all","Games"],["live","Live"],["pre","Upcoming"],["post","Final"],["bye","Bye week"],["roster","All players"]]
    .filter(([k]) => k === "roster" || (!offseason && (k === "all" || counts[k])));
  if(!state.filter || !defs.some(([k]) => k === state.filter)) state.filter = offseason ? "roster" : (liveCount ? "all" : "all");
  $("chips").innerHTML = defs.map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${l}<span class="n">${counts[k]}</span></button>`).join("");

  // stale / delayed notice
  const updated = state.direct ? state.lastSync : new Date(w.updated);
  const stale = liveCount && !state.direct && Date.now() - new Date(w.updated) > 40*60e3;
  $("notice").innerHTML = state.past ? `<div class="warn pastbar"><span>Looking back at <b>${esc(weekLabel(w))}</b>. Players are shown with the team they played for that week.</span><button id="backNow">This week</button></div>` : stale ? `<div class="warn">Scores last updated ${esc(fmtTime(w.updated))}. They may be a few minutes behind while games are live.</div>` : "";

  const has = g => playersFor(g.away.abbr).length + playersFor(g.home.abbr).length > 0;
  const f = state.filter;
  let html = "";
  if(f === "roster") html = rosterView(games);
  else if(f !== "bye"){
    const shown = games.filter(g => f === "all" || g.state === f);
    const withP = shown.filter(g => has(g) && (!state.q || [...playersFor(g.away.abbr), ...playersFor(g.home.abbr)].some(matchesQ)));
    const without = shown.filter(g => !has(g));
    html += withP.length ? `<div class="list">${withP.map(gameCard).join("")}</div>`
                         : `<div class="empty">No ${esc(s.nickname)} match${state.q ? ` “${esc(state.q)}”` : ""} here.</div>`;
    if(without.length && !state.q)
      html += `<div class="section-h">No ${esc(s.nickname)}</div><div class="none">${without.map(g => `${esc(g.away.abbr)} @ ${esc(g.home.abbr)}`).join(" · ")}</div>`;
  }
  if((f === "all" || f === "bye") && byes.length){
    const byeP = byes.flatMap(t => playersFor(t)).filter(matchesQ);
    if(byeP.length || !state.q){
      html += `<div class="section-h">On a bye</div>`;
      html += byeP.length
        ? `<div class="game"><div class="players" style="border-top:0">${byes.map(t => {
            const l = playersFor(t).filter(matchesQ);
            return l.length ? `<div class="pteam">${esc(t)} · ${esc((TEAMS[t]||[])[1]||"")}</div>${l.map(p => playerRow(p)).join("")}` : "";
          }).join("")}</div></div>`
        : `<div class="none">Byes: ${byes.join(", ")}. No ${esc(s.nickname)} on those teams.</div>`;
    }
  }
  $("content").innerHTML = html;

  if(state.past){
    $("footer").innerHTML = `${esc(weekLabel(w))}, ${esc(w.season)} season · final.<br>
      Roster status and injury tags aren't kept for past weeks, and players without a stat line are listed with their current team.<br>
      Data: <a href="https://sleeper.com" target="_blank" rel="noopener">Sleeper</a> rosters, ESPN scores and box scores. Not affiliated with the NFL or any school.`;
    return;
  }
  $("footer").innerHTML = `<span class="sync ${state.direct ? "on" : ""}">${state.direct ? `Live · synced ${esc(fmtTime(state.lastSync))}` : `Scores updated ${esc(fmtTime(updated))}`}</span>
    · Rosters updated ${esc(fmtTime(state.playersUpdated))}.<br>
    “College” is the last school a player attended. Reserve, inactive and practice-squad players are dimmed.<br>
    Data: <a href="https://sleeper.com" target="_blank" rel="noopener">Sleeper</a> rosters, ESPN scores and box scores. Not affiliated with the NFL or any school.`;
}

$("content").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const el = e.target.closest(".p[data-k]"); if(el) toggle(el);
});
$("content").addEventListener("keydown", e => {
  const el = e.target.closest(".p[data-k]");
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggle(el); }
});
function toggleCollege(el){ const k = el.dataset.cg; if(state.copen.has(k)) state.copen.delete(k); else state.copen.add(k); render(); }
$("saturday").addEventListener("click", e => { if(e.target.closest("a")) return; const el = e.target.closest("[data-cg]"); if(el) toggleCollege(el); });
$("saturday").addEventListener("keydown", e => {
  const el = e.target.closest("[data-cg]");
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleCollege(el); }
});
$("tabbar").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b || b.dataset.tab === state.tab) return;
  state.tab = b.dataset.tab;
  const sch = hashParts().school;
  history.replaceState(null, "", "#" + (sch ? sch + "/" : "") + state.tab);
  render(); window.scrollTo(0, 0);
});
$("weekSel").addEventListener("change", e => showWeek(e.target.value).catch(showErr));
$("notice").addEventListener("click", e => { if(e.target.closest("#backNow")) showWeek("").catch(showErr); });
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; state.filter = b.dataset.f; render(); });
$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("school").addEventListener("change", e => { location.hash = e.target.value; });
window.addEventListener("hashchange", () => loadSchool().catch(showErr));
function showErr(e){ $("content").innerHTML = `<div class="err">Couldn't load data. ${esc(e.message)}</div>`; }

(async function init(){
  try{
    const [schools, week, stats, weeks] = await Promise.all([getJSON("schools.json"), getJSON("data/week.json"), getJSON("data/stats.json").catch(() => null),
      getJSON("data/weeks/index.json").catch(() => null)]);
    state.weeks = weeks && weeks.season === week.season ? weeks : null;
    state.schools = schools; state.week = week; state.stats = (stats && stats.week === week.week && stats.games) || {};
    const keys = Object.keys(schools.schools);
    if(keys.length > 1){
      const sel = $("school");
      sel.innerHTML = keys.map(k => `<option value="${k}">${esc(schools.schools[k].name)}</option>`).join("");
      sel.hidden = false;
    }
    await loadSchool();
    if(liveWindow() && await syncDirect()) render();
    if(collegeLive() && await syncCollege()) render();
    schedule();
  }catch(e){ showErr(e); }
})();
</script>
</body>
</html>
